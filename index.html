<style>
:root{--red:#de1322;--black:#08090b;--muted:#5d626a;--shadow:0 10px 28px #00000020;color-scheme:light}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fcfcfc;font-family:Montserrat,Arial,sans-serif;color:var(--black);min-height:100vh}
button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid #1d69fd;outline-offset:4px}
.shell{width:min(100%,490px);min-height:100vh;margin:0 auto;overflow:hidden;background:#fcfcfc}
.hero{height:auto;aspect-ratio:588/556;position:relative;background:#ccc url('assets/capa-andes-sem-mock.webp') center top/cover no-repeat;overflow:hidden}
.nameplate{position:relative;background:white;margin-top:-26px;transform:skewY(-3deg);padding:34px 20px 23px;text-align:center;box-shadow:0 9px 20px #11111113}
.nameplate>*{transform:skewY(3deg)}h1{font-size:clamp(22px,5.6vw,31px);font-weight:800;letter-spacing:-.055em;margin:0 0 9px;line-height:1.12;white-space:nowrap}.role{font-size:clamp(11px,2.6vw,15px);letter-spacing:.19em;color:#45474c;margin:0;font-weight:500}
.content{padding:36px 24px 22px}.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:35px}
.action{border:0;background:transparent;min-width:0;display:flex;flex-direction:column;align-items:center;gap:10px;transition:transform .2s;min-height:104px}.action:hover{transform:translateY(-3px)}.action:active{transform:scale(.96)}.bubble{width:74px;height:74px;border-radius:50%;background:#000;color:white;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px #00000012}.bubble.whatsapp{background:#25d366}.bubble svg{width:36px;height:36px}.action span:last-child{font-size:12px;line-height:1.35;text-align:center;font-weight:500}
.cta{display:flex;gap:15px;align-items:center;min-height:165px;background:linear-gradient(140deg,#ed1723,#cf081b);border:0;color:white;border-radius:24px;padding:20px 18px;box-shadow:0 8px 19px #a5000045;width:100%;text-align:left;transition:transform .22s,box-shadow .22s}.cta:hover{transform:translateY(-3px);box-shadow:0 12px 27px #a500005b}.cta-icon{align-self:flex-start;flex:0 0 58px}.cta-icon svg{width:58px;height:58px}.cta-text{flex:1;min-width:0}.cta strong{display:block;font-size:19px;line-height:1.13;font-weight:800;letter-spacing:-.035em;margin-bottom:12px}.cta small{display:block;font-size:12px;line-height:1.43;font-weight:500}.cta-arrow{flex:0 0 38px;height:38px;border-radius:50%;background:white;color:var(--red);display:grid;place-items:center;align-self:end}.cta-arrow svg{width:24px}
.secondary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:19px 0 23px}.secondary button{border:1px solid #dfe1e3;background:#fff;border-radius:14px;min-height:54px;display:flex;justify-content:center;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#252525}.secondary svg{width:18px;height:18px}.secondary button:hover{background:#f4f5f6}.site{text-align:center;margin:18px 0 8px;letter-spacing:-.04em;font-size:clamp(13px,3.6vw,19px)}.site b{font-weight:800}.fine{text-align:center;font-size:10px;color:#7b7b7b;margin:14px 0 3px}
.dialog{border:0;border-radius:19px;padding:25px;width:min(calc(100% - 30px),375px);box-shadow:0 22px 80px #0007;text-align:center}.dialog::backdrop{background:#0009}.dialog h2{font-size:19px;margin:2px 0 8px}.dialog p{font-size:12px;line-height:1.6;color:#555}.dialog .close{position:absolute;right:14px;top:11px;background:none;border:0;font-size:25px}.qr{display:grid;place-items:center;margin:18px 0}.qr img{width:218px;height:218px}.qr-note{overflow-wrap:anywhere;font-size:11px;color:#666}.copy{background:var(--red);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:700}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:#171717;color:white;border-radius:12px;padding:12px 17px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}.toast.visible{transform:translate(-50%,0);opacity:1}
@media(max-width:540px){body{background:#fff}.shell{margin:0 auto;border-radius:0;border:0;box-shadow:none}.content{padding:35px 24px 25px}}@media(max-width:370px){.content{padding-inline:16px}.bubble{width:63px;height:63px}.bubble svg{width:29px;height:29px}.actions{gap:5px}.cta{gap:9px;padding:17px 14px}.cta-icon{flex-basis:45px}.cta-icon svg{width:45px;height:45px}.cta strong{font-size:16px}.cta small{font-size:11px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}

/* ANDES-500: compact layout based on the usable viewport height.
   Natural document flow preserves access on short screens and with text zoom. */
.shell{min-height:100svh}
.hero{aspect-ratio:auto;height:clamp(180px,calc(100vh - 450px),460px);height:clamp(180px,calc(100svh - 450px),460px);background-size:contain;background-position:center;background-color:#e5e5e5}
.nameplate{margin-top:0;padding:15px 16px 13px}
h1{font-size:clamp(22px,5.6vw,28px);white-space:normal;overflow-wrap:anywhere;margin-bottom:6px}
.role{font-size:12px;letter-spacing:.14em}
.content{padding:18px 20px max(12px,env(safe-area-inset-bottom))}
.actions{gap:10px;margin-bottom:16px}
.action{min-height:80px;gap:6px;padding:0}
.bubble{width:52px;height:52px}
.bubble svg{width:27px;height:27px}
.cta{min-height:108px;padding:14px;gap:10px;border-radius:18px}
.cta-icon{flex-basis:36px;align-self:center}
.cta-icon svg{width:36px;height:36px}
.cta strong{font-size:17px;line-height:1.2;margin-bottom:6px}
.cta small{font-size:12px;line-height:1.4}
.cta-arrow{flex-basis:30px;height:30px;align-self:center}
.cta-arrow svg{width:20px}
.secondary{gap:8px;margin:12px 0}
.secondary button{min-height:44px;padding:6px;font-size:12px}
.site{font-size:clamp(13px,3.6vw,17px);margin:10px 0 0;overflow-wrap:anywhere}
.fine{margin:7px 0 0}
@media(max-width:370px){
  .content{padding-inline:14px}
  .cta{gap:8px;padding:12px}
  .cta-icon{flex-basis:28px}
  .cta-icon svg{width:28px;height:28px}
  .cta strong{font-size:16px}
}
@media(max-height:650px){
  .nameplate{padding-block:12px 10px}
  .content{padding-top:14px}
  .actions{margin-bottom:12px}
  .cta{min-height:100px}
}
</style>
</head>
<body>
<main class="shell" aria-label="Cartão de visitas João Carlos Almeida">
<div class="hero" role="img" aria-label="Logo da Andes Tecnologia e fotografia de João Carlos Almeida sobre fundo de desenvolvimento de software"></div>
<header class="nameplate"><div><h1 id="person-name">João Carlos Almeida</h1><p class="role" id="person-role">DIRETOR DE TECNOLOGIA</p></div></header>
<section class="content" aria-label="Formas de contato">
<div class="actions">
<a href="#" class="action" id="email" aria-label="Enviar e-mail"><span class="bubble"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m3 6 9 7 9-7"/></svg></span><span>E-mail</span></a>
<a href="https://www.andestecnologia.com.br/" class="action" id="website" target="_blank" rel="noopener noreferrer" aria-label="Visitar site da Andes"><span class="bubble"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10.5 13.5a5 5 0 0 0 7.1 0l2.2-2.2a5 5 0 0 0-7.1-7.1l-1.3 1.3"/><path d="M13.5 10.5a5 5 0 0 0-7.1 0l-2.2 2.2a5 5 0 0 0 7.1 7.1l1.3-1.3"/></svg></span><span>Visite nosso<br>site</span></a>
<a href="#" class="action" id="whatsapp" aria-label="Conversar pelo WhatsApp"><span class="bubble whatsapp"><svg viewBox="0 0 32 32" fill="currentColor"><path d="M16 3A12.8 12.8 0 0 0 5 22.5L3.3 29l6.7-1.7A12.9 12.9 0 1 0 16 3Zm0 23.4c-2 0-4-.6-5.6-1.6l-.4-.2-3.9 1 1-3.8-.2-.4A10.6 10.6 0 1 1 16 26.4Zm5.8-7.9c-.3-.2-1.9-.9-2.2-1s-.5-.2-.7.2c-.2.3-.8 1-1 1.1-.2.2-.4.2-.7 0-.4-.2-1.5-.6-2.9-1.8-1.1-1-1.8-2.1-2-2.4-.2-.4 0-.5.1-.7l.5-.6.3-.6c.1-.2 0-.4 0-.6l-1-2.3c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.5s-1.1 1-1.1 2.5 1.1 2.9 1.3 1.5 3 4.1 7.2 5.7 1 .4 1.9.6 2.5.5c.8-.1 1.9-.8 2.1-1.6.3-.8.3-1.5.2-1.6-.1-.1-.3-.2-.7-.4Z"/></svg></span><span>WhatsApp</span></a>
</div>
<button class="cta" id="cta" type="button"><span class="cta-icon" aria-hidden="true"><svg viewBox="0 0 64 64" fill="#fff" stroke="#fff" stroke-width="2"><path d="M39 6c-15 2-25 12-29 27l11 11c15-4 25-14 27-29L39 6Z"/><circle cx="36" cy="18" r="6" fill="#e51224"/><path d="M12 35 5 44l14 1M27 50l-1 9 10-8M13 49l-6 9 9-6" stroke-linejoin="round"/></svg></span><span class="cta-text"><strong>Vamos tirar seu projeto do papel?</strong><small>Sites, sistemas, e-commerce, plataformas e automações para impulsionar o seu negócio.</small></span><span class="cta-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16m-7-7 7 7-7 7"/></svg></span></button>
<div class="secondary"><button id="save" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="9" r="2"/><path d="M8 17c.4-3 7.6-3 8 0"/></svg> Salvar contato</button><button id="share" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="18" cy="5" r="3"/><circle cx="5" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m7.8 10.7 7.5-4.3m-7.5 7 7.5 4.3"/></svg> Compartilhar / QR</button></div>
<p class="site"><a href="https://www.andestecnologia.com.br/" target="_blank" rel="noopener noreferrer">www.<b>andestecnologia</b>.com.br</a></p>
<p class="fine">© <span id="year"></span> Andes Tecnologia</p>
</section>
</main>
<dialog class="dialog" id="qr-dialog"><button class="close" id="close-qr" aria-label="Fechar">×</button><h2>Compartilhe este cartão</h2><p>Aponte a câmera do celular para o QR Code ou copie o link.</p><div class="qr"><img id="qr-image" width="218" height="218" alt="QR Code do cartão digital"></div><p class="qr-note" id="share-url"></p><button class="copy" id="copy-url">Copiar link</button></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
// EDITE APENAS OS DADOS ABAIXO. Não publique contatos falsos.
const CONFIG = {
  name: 'João Carlos Almeida',
  role: 'Diretor de Tecnologia',
  company: 'Andes Tecnologia',
  phone: '', // Ex.: 5519999999999 (com DDI e DDD; somente dígitos)
  email: '', // Ex.: contato@andestecnologia.com.br
  website: 'https://www.andestecnologia.com.br/',
  // Depois de publicar, substitua pela URL definitiva. Vazio = URL atual.
  publicUrl: '',
  whatsappMessage: 'Olá, João! Conheci seu cartão digital e gostaria de conversar sobre um projeto.'
};
const $ = id => document.getElementById(id);
const showToast = message => {const el=$('toast');el.textContent=message;el.classList.add('visible');clearTimeout(showToast.t);showToast.t=setTimeout(()=>el.classList.remove('visible'),3000)};
const onlyDigits = s => (s||'').replace(/\D/g,'');
const url = CONFIG.publicUrl || location.href.split('#')[0].split('?')[0];
$('person-name').textContent=CONFIG.name;
$('person-role').textContent=CONFIG.role.toLocaleUpperCase('pt-BR');
$('year').textContent=new Date().getFullYear();
$('website').href=CONFIG.website;
$('email').addEventListener('click',e=>{if(!CONFIG.email){e.preventDefault();showToast('Configure o e-mail no arquivo HTML.');return;}e.currentTarget.href='mailto:'+CONFIG.email});
$('whatsapp').addEventListener('click',e=>{e.preventDefault();if(!onlyDigits(CONFIG.phone)){showToast('Configure o telefone no arquivo HTML.');return;}window.open('https://wa.me/'+onlyDigits(CONFIG.phone)+'?text='+encodeURIComponent(CONFIG.whatsappMessage),'_blank','noopener,noreferrer')});
$('cta').addEventListener('click',()=>{if(!onlyDigits(CONFIG.phone)){showToast('Configure o WhatsApp para ativar o orçamento.');return;}window.open('https://wa.me/'+onlyDigits(CONFIG.phone)+'?text='+encodeURIComponent('Olá, João! Quero solicitar um orçamento para meu projeto.'),'_blank','noopener,noreferrer')});
const vcfValue = s => String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,');
$('save').addEventListener('click',()=>{
  const parts=CONFIG.name.trim().split(/\s+/);const last=parts.length>1?parts.pop():'';const first=parts.join(' ')||CONFIG.name;
  const lines=['BEGIN:VCARD','VERSION:3.0','N:'+vcfValue(last)+';'+vcfValue(first)+';;;','FN:'+vcfValue(CONFIG.name),'ORG:'+vcfValue(CONFIG.company),'TITLE:'+vcfValue(CONFIG.role)];
  if(onlyDigits(CONFIG.phone))lines.push('TEL;TYPE=CELL:+'+onlyDigits(CONFIG.phone));
  if(CONFIG.email)lines.push('EMAIL;TYPE=INTERNET:'+vcfValue(CONFIG.email));
  lines.push('URL:'+CONFIG.website,'END:VCARD');
  const blob=new Blob([lines.join('\r\n')+'\r\n'],{type:'text/vcard;charset=utf-8'});
  const href=URL.createObjectURL(blob);const a=document.createElement('a');a.href=href;a.download='joao-carlos-almeida.vcf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),1500);
  if(!CONFIG.email||!CONFIG.phone)showToast('Contato salvo com os dados disponíveis; configure telefone e e-mail para completar.');
});
// QR em serviço externo: o cartão funciona mesmo sem JavaScript de terceiros.
$('share-url').textContent=url;
$('qr-image').src='https://api.qrserver.com/v1/create-qr-code/?size=250x250&margin=12&data='+encodeURIComponent(url);
$('share').addEventListener('click',async()=>{if(navigator.share){try{await navigator.share({title:CONFIG.name+' | '+CONFIG.company,text:'Meu cartão de visitas digital',url});return}catch(e){if(e.name==='AbortError')return}}$('qr-dialog').showModal()});
$('close-qr').addEventListener('click',()=>$('qr-dialog').close());
$('qr-dialog').addEventListener('click',e=>{if(e.target===$('qr-dialog'))$('qr-dialog').close()});
$('copy-url').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(url);showToast('Link copiado!')}catch{showToast('Copie o endereço exibido acima.')}});
</script>
</body>
</html>
